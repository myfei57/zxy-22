<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>读数控制台 - EnvMonitor</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    select, button { margin: 0.25rem; }
  </style>
</head>
<body>
  <h1>读数控制台</h1>
  <nav>
    <a href="/stations">站点</a> |
    <a href="/readings">读数</a> |
    <a href="/alerts">告警</a> |
    <a href="/audit">审计</a>
  </nav>
  <select id="station"></select>
  <button onclick="load()">查询</button>
  <table id="readings">
    <thead><tr><th>站点</th><th>指标</th><th>数值</th><th>时间</th><th>超标</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    async function stations() {
      const rows = await (await fetch("/api/stations")).json();
      const select = document.getElementById("station");
      for (const st of rows) {
        const opt = document.createElement("option");
        opt.value = st.id;
        opt.textContent = st.name;
        select.appendChild(opt);
      }
    }
    async function load() {
      const id = document.getElementById("station").value;
      const rows = await (await fetch("/api/readings?station=" + id)).json();
      const tbody = document.querySelector("#readings tbody");
      tbody.innerHTML = "";
      for (const rd of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + rd.station_id + "</td><td>" + rd.metric_id + "</td><td>" + rd.value +
          "</td><td>" + rd.timestamp + "</td><td>" + rd.over_threshold + "</td>";
        tbody.appendChild(tr);
      }
    }
    stations();
  </script>
</body>
</html>
