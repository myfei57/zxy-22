<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>告警控制台 - EnvMonitor</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .btn { margin: 0 0.25rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>告警控制台</h1>
  <nav>
    <a href="/stations">站点</a> |
    <a href="/readings">读数</a> |
    <a href="/alerts">告警</a> |
    <a href="/audit">审计</a>
  </nav>
  <button class="btn" onclick="retry()">重试未确认告警</button>
  <table id="alerts">
    <thead><tr><th>指标</th><th>数值</th><th>阈值</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    async function load() {
      const rows = await (await fetch("/api/alerts")).json();
      const tbody = document.querySelector("#alerts tbody");
      tbody.innerHTML = "";
      for (const al of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + al.metric_id + "</td><td>" + al.value + "</td><td>" + al.threshold +
          "</td><td>" + al.status + "</td><td>" + al.raised_at + "</td>" +
          "<td><button class='btn' onclick='ack(\"" + al.id + "\")'>确认</button></td>";
        tbody.appendChild(tr);
      }
    }
    async function ack(id) {
      await fetch("/api/alerts/" + id + "/ack", { method: "POST" });
      load();
    }
    async function retry() {
      await fetch("/api/alerts/retry", { method: "POST" });
      load();
    }
    load();
  </script>
</body>
</html>
